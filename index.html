<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Incident Desk</title>
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Initialize Supabase -->
    <script>
      const SUPABASE_URL = 'https://leodtboncrsvugugqjea.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_iIhv7iCli8S230Mb6tqzng_IK4focdp';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        :root {--navy:#10213b;--blue:#2563eb;--bg:#f3f6fb;--white:#fff;--text:#182438;--muted:#66758a;--border:#dfe6ef}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
        header{background:var(--navy);color:white;padding:24px 18px}
        header h1{margin:0 0 7px;font-size:25px}
        header p{margin:0;color:#d4deef;font-size:14px}
        main{max-width:1100px;margin:22px auto;padding:0 14px}
        .card, .panel{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
        h2{font-size:19px;margin:0 0 16px}
        .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
        .field{display:flex;flex-direction:column;gap:6px}
        .field.full{grid-column:1/-1}
        label{font-size:13px;font-weight:bold}
        input, select, textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:14px}
        button{background:var(--blue);color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:12px}
        button:hover{opacity:0.9}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th, td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
        th{color:var(--muted);font-weight:600}
    </style>
</head>
<body>

    <header>
        <h1>Security Incident Desk</h1>
        <p>Live Enterprise Cloud Dashboard connected to Supabase</p>
    </header>

    <main>
        <!-- Report Incident Form -->
        <div class="panel">
            <h2>Report New Incident</h2>
            <form id="incident-form">
                <div class="form-grid">
                    <div class="field full">
                        <label>Incident Title</label>
                        <input type="text" id="title" required placeholder="e.g., Unauthorized access attempt">
                    </div>
                    <div class="field">
                        <label>Severity</label>
                        <select id="severity">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Reported By</label>
                        <input type="text" id="reported_by" required placeholder="Your name">
                    </div>
                    <div class="field full">
                        <label>Description</label>
                        <textarea id="description" rows="3" placeholder="Provide details about the incident..."></textarea>
                    </div>
                </div>
                <button type="submit">Submit Incident</button>
            </form>
        </div>

        <!-- Incident List Table -->
        <div class="panel">
            <h2>Live Incidents Feed</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Title</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Reported By</th>
                    </tr>
                </thead>
                <tbody id="incidents-table-body">
                    <tr><td colspan="5" style="text-align:center; color:var(--muted);">Loading incidents from cloud...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Fetch and display incidents on load
        async function loadIncidents() {
            const tbody = document.getElementById('incidents-table-body');
            const { data, error } = await supabase.from('incidents').select('*').order('created_at', { ascending: false });
            console.log('Supabase load result:', { data, error });
console.log('Incidents table element found:', !!tbody);
            if (error) {
                console.error('Error fetching incidents:', error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Error loading database records.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted);">No incidents reported yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(inc => `
                <tr>
                    <td>${new Date(inc.created_at).toLocaleString()}</td>
                    <td><strong>${escapeHtml(inc.title)}</strong></td>
                    <td><span style="padding:4px 8px; border-radius:4px; font-size:12px; background:${getSeverityColor(inc.severity)}; color:white;">${inc.severity}</span></td>
                    <td>${inc.status || 'Open'}</td>
                    <td>${escapeHtml(inc.reported_by || 'Unknown')}</td>
                </tr>
            `).join('');
        }

        // Handle form submission
        document.getElementById('incident-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const severity = document.getElementById('severity').value;
            const reported_by = document.getElementById('reported_by').value;
            const description = document.getElementById('description').value;

            const { error } = await supabase.from('incidents').insert([{ title, severity, reported_by, description }]);

            if (error) {
                alert('Error saving incident: ' + error.message);
            } else {
                alert('Incident successfully logged to Supabase cloud!');
                document.getElementById('incident-form').reset();
                loadIncidents();
            }
        });

        function getSeverityColor(sev) {
            switch(sev) {
                case 'Critical': return '#dc2626';
                case 'High': return '#ea580c';
                case 'Medium': return '#d97706';
                default: return '#2563eb';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load data when page opens
        loadIncidents();
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Incident Desk - Connection Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
      padding: 20px;
    }
    main {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }
    button {
      background: #17365d;
      color: white;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      margin: 6px 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f1f5f9;
      padding: 12px;
    }
  </style>
</head>
<body>
<main>
  <h1>Security Incident Desk</h1>
  <h2>Database Connection Test</h2>
  <p id="status">Checking connection...</p>
  <button id="load">Load Incident Records</button>
  <button id="logout">Sign Out</button>
  <pre id="results">No records loaded yet.</pre>
</main>

<script>
const SUPABASE_URL =
  "https://leodtboncrsvugugqjea.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iIhv7iCli8S230Mb6tqzng_IK4focdp";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("results");

async function checkLogin() {
  const { data, error } = await client.auth.getUser();

  if (error || !data.user) {
    statusBox.textContent =
      "You are not signed in. Open supabase-test.html and sign in first.";
    return false;
  }

  statusBox.textContent = "Signed in as " + data.user.email;
  return true;
}

document.getElementById("load").onclick = async () => {
  statusBox.textContent = "Loading incident records...";
  resultsBox.textContent = "Please wait...";

  const loggedIn = await checkLogin();

  if (!loggedIn) {
    resultsBox.textContent = "Sign in before loading records.";
    return;
  }

  const { data, error } = await client
    .from("incidents")
    .select("*")
    .limit(20);

  if (error) {
    statusBox.textContent = "Could not load records.";
    resultsBox.textContent = error.message;
    return;
  }

  statusBox.textContent = "Database connection successful!";
  resultsBox.textContent = data.length
    ? JSON.stringify(data, null, 2)
    : "Connected successfully. No incident records were found.";
};

document.getElementById("logout").onclick = async () => {
  const { error } = await client.auth.signOut();
  statusBox.textContent = error
    ? "Sign out failed: " + error.message
    : "Signed out successfully.";
  resultsBox.textContent = "";
};

checkLogin();
</script>
</body>
</html>
